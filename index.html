<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAFAF8" />
    <meta name="description" content="ADMAKI Menu — a modern QR menu and digital guest experience for restaurants." />
    <meta property="og:title" content="ADMAKI Menu — Your menu. Always fresh." />
    <meta property="og:description" content="One permanent QR code with a restaurant menu you can update anytime." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://menu.admakidigital.com/" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta property="og:image" content="https://menu.admakidigital.com/brand/social-preview.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://menu.admakidigital.com/" />
    <title>ADMAKI Menu — Your menu. Always fresh.</title>
  </head>
  <body>
    <script>
      // Preserve every existing Menu-Go QR code and saved admin URL.
      // Browser fragments are invisible to Cloudflare routing, so redirect client-side.
      if (window.location.hash.startsWith('#/')) {
        window.location.replace('https://app.admakidigital.com/' + window.location.search + window.location.hash);
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
